name: Build and deploy frontend (Vite) to Azure Web App - kaioba-oficina

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: SPA fallback (404 -> index.html)
        run: cp build/index.html build/404.html

      - name: Upload build artifact (STATIC FILES ONLY)
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: build/*   # <<< EXTREMAMENTE IMPORTANTE

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E82FC3AB3A894C0F9C07E3CA3D4E17F1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BCBFDA25B2F243E9AB1882DBB02957A2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9074037D826242F48E2AEF006216E5F6 }}

      - name: Deploy static site to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: kaioba-oficina
          package: .
``
